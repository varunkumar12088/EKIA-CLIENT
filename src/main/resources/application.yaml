spring:
  application:
    name: EKIA-AGENT-SERVICE

  ai:
    mcp:
      client:
        enabled: true
        name: ekia-mcp-client
        version: 1.0.0
        type: SYNC
        request-timeout: 20s

        streamable-http:
          connections:
            ekia-server:
              url: http://localhost:8081
              endpoint: /mcp
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          model: minimax/minimax-m3:free
server:
  port: 8080

#debug: true

app:
  environment: local
  ai:
    openrouter:
      model: nvidia/nemotron-3-ultra-550b-a55b:free
      temperature: 0.2
      max-tokens: 2000
    gemini:
      model: gemini-3.1-flash-image
      temperature: 0.2
      max-tokens: 2000
    embedding:
      provider: future-provider
      model: future-embedding-model
      batch-size: 100
  retry:
    max-attempts: 3
    initial-interval: 1000
    max-interval: 10000
    multiplier: 2
  timeout:
    llm: 30s
    mcp: 10s


resilience4j:
  circuitbreaker:
    instances:
      llm:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3