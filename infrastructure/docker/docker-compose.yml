services:

  # ==========================================
  # PostgreSQL + pgvector
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ekia-postgres

    environment:
      POSTGRES_DB: ekia
      POSTGRES_USER: ekia_user
      POSTGRES_PASSWORD: ekia_password

    ports:
      - "5432:5432"

    volumes:
      - "F:/rag-data/postgres:/var/lib/postgresql/data"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekia_user -d ekia"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================
  # Neo4j - Knowledge Graph
  # ==========================================
  neo4j:
    image: neo4j:5-community
    container_name: ekia-neo4j

    environment:
      NEO4J_AUTH: neo4j/ekia_password

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - "F:/rag-data/neo4j/data:/data"
      - "F:/rag-data/neo4j/logs:/logs"

    restart: unless-stopped


  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ekia-redis

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - "F:/rag-data/redis:/data"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================
  # Kafka - KRaft Mode
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: ekia-kafka

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - "F:/rag-data/kafka:/var/lib/kafka/data"

    restart: unless-stopped